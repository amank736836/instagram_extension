<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Manager</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <img src="icons/icon48.png" alt="Icon" class="logo">
                <span>IG Manager</span>
            </div>
            <button id="btn-detach" class="icon-btn" title="Detach Window">⧉</button>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="tab-list" id="btn-tab-list">Non-Followers <span id="nf-badge"
                    class="badge hidden">0</span></button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Followers</span>
                    <span class="stat-value" id="followersCount">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Following</span>
                    <span class="stat-value" id="followingCount">-</span>
                </div>
                <div class="stat-card highlight" id="nonFollowersCard" title="Click to view list">
                    <span class="stat-label">Don't Follow Back</span>
                    <span class="stat-value" id="nonFollowersCount">-</span>
                </div>
            </div>

            <div class="actions">
                <button id="btnScan" class="primary-btn">
                    <span class="icon">🔍</span> Scan Profile
                </button>
                <div id="scanStatus" class="scan-status hidden">
                    <span class="spinner">⏳</span> Scanning...
                    <button id="btnStopScan" class="small-btn danger-btn">Stop</button>
                </div>
                <button id="btnUnfollow" class="danger-btn" disabled>
                    <span class="icon">⚡</span> Unfollow (Safe Mode)
                </button>
            </div>

            <div class="logs-container">
                <h3>Activity Log</h3>
                <div id="logs" class="logs">
                    <div class="log-item">Extension loaded...</div>
                </div>
            </div>
        </div>

        <!-- TAB 2: LIST VIEW -->
        <div id="tab-list" class="tab-content">
            <div class="list-header">
                <h3>Who doesn't follow back?</h3>
                <span class="subtext">Review before unfollowing</span>
            </div>
            <div id="userList" class="user-list">
                <div class="empty-state">Scan to see users here</div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
