<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG Manager</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>IG Manager</h1>
            </div>
            <div class="header-controls">
                <button id="btn-detach" class="icon-btn" title="Open in New Window (Keep Active)">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </button>
                <div class="status-badge" id="statusBadge">Ready</div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Followers</span>
                <span class="stat-value" id="followersCount">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Following</span>
                <span class="stat-value" id="followingCount">-</span>
            </div>
            <div class="stat-card highlight" id="nonFollowersCard" style="cursor: pointer;" title="Click to view list">
                <span class="stat-label">Don't Follow Back</span>
                <span class="stat-value" id="nonFollowersCount">-</span>
            </div>
        </div>

        <div class="view-controls">
            <button id="btnShowList" class="secondary-btn" style="width: 100%; margin-bottom: 10px;">
                Show Non-Followers List 📋
            </button>
        </div>

        <div id="userList" class="user-list hidden">
            <!-- List items injected here -->
        </div>

        <div class="actions">
            <button id="btnScan" class="primary-btn">
                <span class="icon">🔍</span> Scan Profile
            </button>
            <div id="scanStatus" class="scan-status hidden">
                <span class="spinner">⏳</span> Scanning...
                <button id="btnStopScan" class="small-btn danger-btn">Stop</button>
            </div>
            <button id="btnUnfollow" class="danger-btn" disabled>
                <span class="icon">⚡</span> Unfollow (Safe Mode)
            </button>
        </div>

        <div class="logs-container">
            <h3>Activity Log</h3>
            <div id="logs" class="logs">
                <div class="log-item">Extension loaded...</div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
